<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau JS</title>
</head>
<body>
    <h2>Exercices sur les tableaux avec JS </h2>
    <script>
        const tab=["Lundi","Mardi","Mercredi","Jeudi"];
        tab.push("Vendredi");
        tab.unshift("vendredi");
        document.write(tab+"<br>");
        let texte = "Souleymanesidibe FatoumataToure Amadoukeita";
        let textespliter = texte.split(" ");
        document.write(textespliter[2]);
        document.write(textespliter[0]);
    </script>
    
</body>
</html>
