<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonction en JS</title>
</head>
<body>
    <h2>Exercice 02 : Fonction Produit et Moyenne</h2><hr>
    <script>
     
        // Saisi des trois entiers par utilisateur : 

        let a=parseInt(prompt("Entrez la valeur de a : ")) ;
        let b=parseInt(prompt("Entrez la valeur de b : ")) ;
        let c=parseInt(prompt("Entrez la valeur de c : ")) ;

        // Fonction permettant de calculer le produit de a,b et c
        function produit(x,y,z){
            let produit = x*y*z ;
            document.write("Le produit des trois nombres est : "+produit+"<br>");
        }

        //Fonction permettant de calculer moyenne de a,b et c

       function moyenne(x,y,z){
        let moyenne = (x+y+z)/3 ;
        document.write("La Moyenne des trois nombres est : "+moyenne+"<br>");
       }
       //appels des fonctions 
        moyenne(a,b,c);
        produit(a,b,c);

    </script>
    
</body>
</html>
