<!DOCTYPE html>
<html lang="en">
<head>

    <title>Fonction en Js</title>
</head>
<body>
    <h2>Application 1 : Les fonctions en Js</h2>
    <script>
        // Premiere methode :
        let a, b ;
        function difference1(a,b){
            let difference1 = a-b ;
            document.write("Difference_1 = "+difference1+"<br>");
        }
        difference1(10,5);
        //Deuxieme methode 
        function difference2(a,b){
            return a-b;
        }
        document.write("Difference_2 ="+difference2(7,4));
    </script>
</body>
