<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOUCLE FOR</title>
</head>
<body>
        <h2>Table de multiplication avec la boucle FOR : </h2>
        <script>
            let nombre = parseFloat(prompt("Entrez un nombre : "));
            let i ;
            for(i=0 ;i <= 10 ;i++){
                document.write(nombre+" X "+i+" = "+(nombre*i)+"<br>");
            }
        </script>
    
</body>
</html>
