<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparaison</title>
</head>
<body>
    <h2>Operateur de comparaison avec Java Script</h2><hr>
    <script>
        let a =parseFloat(prompt("Donnez la valeur de a = "));
        let b=parseFloat(prompt("Donnez la valeur de b = ")) ;
        let somme = a + b ;
        if(a==b){
            document.write("a et b sont egaux ");
        }
        else{
            document.write("a et b sont differents");
        }
        document.write("<br> Somme = "+somme);
    </script>
</body>
</html>
