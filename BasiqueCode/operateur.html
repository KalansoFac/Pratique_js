    <hr>
    <h4>Operateur d'affectation</h4>
    <script>
        let a = 4 ;
        document.write("Addition puis Affectation simple a +=2 vaut : "+ (a +=2)+"<br>");
        document.write("Soustraction puis Affectation simple a -=2 vaut : "+ (a -=3)+"<br>");
        document.write("Multiplication puis Affectation simple a +=2 vaut : "+ (a *=5)+"<br>");
