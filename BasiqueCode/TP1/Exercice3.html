<body>
    <h3>Exerice03 : </h3><hr>
    <script>
        let nom=prompt("Quel est votre nom ? ");
        let test = confirm("Est-ce votre nom : "+nom);
        if(test==true){
            alert("Votre nom est : "+nom);
        }
        else{
            alert("Prenom incorrecte !");
        }
    </script>
